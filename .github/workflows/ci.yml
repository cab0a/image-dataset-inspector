name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify CLI installation
        run: image-dataset-inspector --help

      - name: Run README Quick Start
        if: matrix.python-version == '3.12'
        run: |
          python examples/generate_demo_images.py --output output/demo_images
          image-dataset-inspector inspect output/demo_images \
            --output output/report.csv
          test -s output/report.csv
          python -c "import csv; rows = list(csv.DictReader(open('output/report.csv', encoding='utf-8'))); assert len(rows) == 6 and sum(row['status'] == 'unreadable' for row in rows) == 1"

      - name: Run tests
        run: python -m pytest
